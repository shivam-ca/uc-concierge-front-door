<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Knowledge Agent</title>
<!-- A separate page: it shares the look of the Knowledge Agent console but none of its code. Its only server
     contact is /api/chat/*, so removing web/chat (or CHAT_ENABLED=false) takes it away and nothing else. -->
<style>
:root {
  --bg:#f5f6f8; --surface:#ffffff; --sunken:#f9fafb; --soft:#f2f4f7; --line:#e4e7ec; --line-2:#d0d5dd;
  --ink:#101828; --ink-2:#344054; --ink-3:#667085;
  --brand:#0b4a9e; --brand-solid:#0b4a9e; --brand-bg:#eaf1fb;
  --go:#067647; --go-bg:#e8f5ee; --warn:#b54708; --warn-bg:#fff4e5; --bad:#b42318; --bad-bg:#fdecea;
  --mine:#0b4a9e; --mine-ink:#ffffff; --teamc:#5b5fc7; --teamc-bg:#ecebfa;
  --shadow:0 1px 2px rgba(16,24,40,.06); --r:12px; --r-sm:8px;
  font-family:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,sans-serif; font-size:15px; line-height:1.55; color:var(--ink); background:var(--bg);
}
@media (prefers-color-scheme: dark) { :root {
  --bg:#0c1118; --surface:#141b25; --sunken:#101720; --soft:#1a2330; --line:#232d3b; --line-2:#324052;
  --ink:#f2f4f7; --ink-2:#cdd5df; --ink-3:#98a2b3; --brand:#8db3f0; --brand-solid:#2f6fd0; --brand-bg:#16263d;
  --go:#5fd08f; --go-bg:#0f2a1c; --warn:#f0b266; --warn-bg:#2e2411; --bad:#f1968c; --bad-bg:#341a19;
  --mine:#2f6fd0; --teamc:#a4acec; --teamc-bg:#22244a; --shadow:none; } }
* { box-sizing:border-box; } html, body { height:100%; } body { margin:0; background:var(--bg); color:var(--ink); }
:focus-visible { outline:2px solid var(--brand); outline-offset:2px; }
button { font:inherit; font-size:14px; font-weight:600; min-height:38px; padding:0 14px; border-radius:var(--r-sm); border:1px solid var(--line-2); background:var(--surface);
  color:var(--ink-2); cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:7px; box-shadow:var(--shadow); }
button:hover:not(:disabled) { background:var(--soft); } button:disabled { opacity:.5; cursor:default; }
button.primary { background:var(--brand-solid); border-color:var(--brand-solid); color:#fff; } button.primary:hover:not(:disabled) { filter:brightness(.92); background:var(--brand-solid); }
button.ghost { background:none; border-color:transparent; box-shadow:none; } button.ghost:hover:not(:disabled) { background:var(--soft); }
button.danger { color:var(--bad); border-color:color-mix(in srgb, var(--bad) 35%, var(--line-2)); }
button.icon { width:38px; padding:0; } svg.i { width:1.15em; height:1.15em; flex:none; }
input, textarea, select { font:inherit; font-size:14.5px; color:var(--ink); background:var(--surface); border:1px solid var(--line-2); border-radius:var(--r-sm); padding:8px 12px; min-height:40px; }
input:focus, textarea:focus, select:focus { outline:3px solid color-mix(in srgb, var(--brand) 22%, transparent); border-color:var(--brand); }
.sr-only { position:absolute; width:1px; height:1px; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; padding:0; }
.hidden, [hidden] { display:none !important; } .muted { color:var(--ink-3); } .small { font-size:13px; }

/* header */
header.top { height:60px; display:flex; align-items:center; gap:14px; padding:0 24px; background:var(--surface); border-bottom:1px solid var(--line); }
.brand { display:flex; align-items:center; gap:11px; font-size:16.5px; font-weight:650; letter-spacing:-.015em; }
.logo { width:32px; height:32px; border-radius:9px; background:var(--brand-solid); color:#fff; display:flex; align-items:center; justify-content:center; } .logo svg.i { width:18px; height:18px; }
.crumb { color:var(--ink-3); font-weight:500; } .spacer { flex:1; }
.who { display:flex; align-items:center; gap:10px; }
.seg { display:inline-flex; background:var(--soft); border-radius:10px; padding:3px; }
.seg button { border:0; background:none; box-shadow:none; min-height:32px; color:var(--ink-3); } .seg button[aria-pressed="true"] { background:var(--surface); color:var(--ink); box-shadow:0 1px 2px rgba(16,24,40,.14); }
.namebox { width:170px; min-height:34px; padding:4px 10px; } .backlink { display:none; }
.linkout { color:var(--brand); font-weight:600; font-size:13.5px; text-decoration:none; } .linkout:hover { text-decoration:underline; }

/* layout */
.app { display:grid; grid-template-columns:minmax(300px, 360px) minmax(0,1fr) 320px; height:calc(100vh - 60px); }
.brand .bt { white-space:nowrap; }
.app.noside { grid-template-columns:minmax(300px, 360px) minmax(0,1fr); }
.col { min-height:0; min-width:0; display:flex; flex-direction:column; background:var(--surface); }
.convs { border-right:1px solid var(--line); } .side { border-left:1px solid var(--line); overflow:auto; background:var(--sunken); }
.colhead { padding:14px 16px 10px; border-bottom:1px solid var(--line); display:flex; flex-direction:column; gap:10px; }
.colhead .row { display:flex; gap:8px; align-items:center; } .colhead h2 { margin:0; font-size:17px; flex:1; letter-spacing:-.01em; }
.searchbox { position:relative; } .searchbox svg.i { position:absolute; left:11px; top:11px; color:var(--ink-3); pointer-events:none; } .searchbox input { width:100%; padding-left:34px; }
.tabs { display:flex; gap:4px; flex-wrap:wrap; } .tabs button { min-height:30px; padding:0 10px; font-size:13px; border:0; box-shadow:none; background:none; color:var(--ink-3); border-radius:99px; }
.tabs button[aria-pressed="true"] { background:var(--brand-bg); color:var(--brand); } .tabs .n { font-size:11.5px; background:var(--soft); border-radius:99px; padding:0 6px; margin-left:2px; color:var(--ink-2); }
.tabs button[aria-pressed="true"] .n { background:var(--surface); }
.list { overflow:auto; flex:1; }
.conv { display:grid; grid-template-columns:40px 1fr; gap:12px; padding:13px 16px; border-bottom:1px solid var(--line); cursor:pointer; border-left:3px solid transparent; text-align:left; background:none; border-top:0; border-right:0; width:100%; border-radius:0; box-shadow:none; min-height:0; align-items:start; justify-content:start; font-weight:400; }
.conv:hover { background:var(--sunken); } .conv[aria-current="true"] { background:var(--brand-bg); border-left-color:var(--brand-solid); }
.avatar { width:40px; height:40px; border-radius:50%; background:var(--brand-bg); color:var(--brand); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:14px; flex:none; }
.avatar.agent { background:var(--brand-solid); color:#fff; } .avatar.team { background:var(--teamc-bg); color:var(--teamc); } .avatar svg.i { width:19px; height:19px; }
.conv > span { min-width:0; } .conv .top { display:flex; gap:8px; align-items:baseline; } .conv .name { font-weight:650; font-size:14.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--ink); }
.conv .time { margin-left:auto; flex:none; font-size:12.5px; color:var(--ink-3); } .conv .title { font-size:14px; color:var(--ink-2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; margin:1px 0; }
.conv .prev { font-size:13px; color:var(--ink-3); display:-webkit-box; -webkit-line-clamp:1; -webkit-box-orient:vertical; overflow:hidden; } .conv .foot { display:flex; gap:6px; margin-top:6px; flex-wrap:wrap; }
.sb { display:inline-flex; align-items:center; gap:4px; font-size:12px; font-weight:650; line-height:1; padding:4px 8px; border-radius:6px; background:var(--soft); color:var(--ink-2); white-space:nowrap; }
.sb svg.i { width:13px; height:13px; } .sb.ok { background:var(--go-bg); color:var(--go); } .sb.warn { background:var(--warn-bg); color:var(--warn); } .sb.bad { background:var(--bad-bg); color:var(--bad); } .sb.info { background:var(--brand-bg); color:var(--brand); } .sb.team { background:var(--teamc-bg); color:var(--teamc); }

/* thread */
.thread { background:var(--bg); } .thead { display:flex; align-items:center; gap:12px; padding:12px 20px; background:var(--surface); border-bottom:1px solid var(--line); min-height:64px; }
.thead h2 { margin:0; font-size:16px; letter-spacing:-.01em; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; } .thead .sub { font-size:13px; color:var(--ink-3); }
.msgs { flex:1; overflow-y:auto; overflow-x:hidden; min-width:0; padding:20px 24px; display:flex; flex-direction:column; gap:14px; scroll-behavior:smooth; }
.day { align-self:center; font-size:12px; color:var(--ink-3); background:var(--soft); border-radius:99px; padding:2px 12px; }
.msg { display:flex; gap:10px; max-width:min(760px, 92%); min-width:0; } .msg .avatar { flex:none; } .msg.mine { align-self:flex-end; flex-direction:row-reverse; } .msg.sys { align-self:center; max-width:90%; }
.bub { max-width:100%; background:var(--surface); border:1px solid var(--line); border-radius:4px 14px 14px 14px; padding:10px 14px; box-shadow:var(--shadow); min-width:0; overflow-wrap:anywhere; }
.msg.mine .bub { background:var(--mine); border-color:var(--mine); color:var(--mine-ink); border-radius:14px 4px 14px 14px; }
.msg.team .bub { border-left:3px solid var(--teamc); } .msg.agent .bub { border-left:3px solid var(--brand-solid); }
.meta { display:flex; gap:8px; align-items:baseline; margin-bottom:2px; font-size:12.5px; } .meta b { font-size:13.5px; } .msg.mine .meta { justify-content:flex-end; color:rgba(255,255,255,.85); } .msg:not(.mine) .meta { color:var(--ink-3); } .msg:not(.mine) .meta b { color:var(--ink); }
.body p { margin:4px 0; } .body h4 { margin:10px 0 3px; font-size:14.5px; } .body ul { margin:4px 0; padding-left:20px; } .body a { color:var(--brand); } .msg.mine .body a { color:#fff; }
.sys-note { display:flex; gap:8px; align-items:center; background:var(--soft); color:var(--ink-2); font-size:13px; border-radius:99px; padding:5px 14px; } .sys-note.bad { background:var(--bad-bg); color:var(--bad); } .sys-note svg.i { width:15px; height:15px; }
.handoff { display:flex; gap:10px; align-items:flex-start; background:var(--warn-bg); color:var(--ink); border:1px solid color-mix(in srgb, var(--warn) 30%, transparent); border-radius:var(--r-sm); padding:10px 12px; margin-top:8px; font-size:14px; }
.handoff svg.i { color:var(--warn); margin-top:2px; }
.src { margin-top:10px; border-top:1px solid var(--line); padding-top:8px; } .src h5 { margin:0 0 6px; font-size:11.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-3); }
.srow { display:flex; gap:8px; align-items:center; padding:5px 8px; border-radius:7px; background:var(--sunken); margin-bottom:5px; font-size:13.5px; }
.srow { min-width:0; } .srow a { min-width:0; color:var(--brand); font-weight:600; text-decoration:none; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; } .srow a:hover { text-decoration:underline; } .srow .sb { margin-left:auto; }
.disc span { min-width:0; overflow-wrap:anywhere; } .disc { margin-top:8px; font-size:12.5px; color:var(--ink-3); display:flex; gap:6px; align-items:flex-start; } .disc svg.i { margin-top:2px; color:var(--brand); width:14px; height:14px; }
.conf { display:inline-flex; align-items:center; gap:6px; margin-top:8px; font-size:12.5px; color:var(--ink-3); } .meter { width:70px; height:6px; background:var(--line); border-radius:99px; overflow:hidden; } .meter span { display:block; height:100%; background:var(--go); } .meter.medium span { background:var(--warn); } .meter.low span { background:var(--bad); }
.typing { align-self:flex-start; display:flex; gap:10px; align-items:center; } .typing .bub { padding:10px 14px; display:flex; flex-direction:column; gap:6px; }
.dots { display:inline-flex; gap:4px; } .dots i { width:7px; height:7px; border-radius:50%; background:var(--ink-3); animation:blink 1.2s infinite; } .dots i:nth-child(2) { animation-delay:.2s; } .dots i:nth-child(3) { animation-delay:.4s; }
@keyframes blink { 0%, 80%, 100% { opacity:.25; } 40% { opacity:1; } } @media (prefers-reduced-motion: reduce) { .dots i { animation:none; opacity:.6; } .msgs { scroll-behavior:auto; } }
.step { font-size:13px; color:var(--ink-2); }

/* composer */
.composer { background:var(--surface); border-top:1px solid var(--line); padding:12px 20px 14px; }
.composer .box { display:flex; gap:10px; align-items:flex-end; } .composer textarea { flex:1; resize:none; min-height:44px; max-height:160px; line-height:1.45; }
.composer .hint { margin-top:6px; font-size:12.5px; color:var(--ink-3); display:flex; gap:12px; flex-wrap:wrap; } kbd { font:600 11px ui-monospace, Consolas, monospace; border:1px solid var(--line-2); border-radius:5px; padding:0 5px; background:var(--sunken); }
.banner { display:flex; gap:10px; align-items:center; padding:10px 14px; font-size:14px; border-bottom:1px solid; } .banner.warn { background:var(--warn-bg); color:var(--warn); border-color:color-mix(in srgb, var(--warn) 30%, transparent); }
.banner.bad { background:var(--bad-bg); color:var(--bad); border-color:color-mix(in srgb, var(--bad) 30%, transparent); } .banner.info { background:var(--brand-bg); color:var(--brand); border-color:color-mix(in srgb, var(--brand) 25%, transparent); }
.banner .spacer { flex:1; } .banner button { min-height:30px; font-size:13px; }
.teambar { padding:12px 20px; background:var(--surface); border-top:1px solid var(--line); display:flex; gap:8px; flex-wrap:wrap; align-items:center; }

/* welcome / empty */
.welcome { margin:auto; text-align:center; max-width:520px; padding:30px 20px; } .welcome .art { width:64px; height:64px; border-radius:50%; background:var(--brand-bg); color:var(--brand); display:inline-flex; align-items:center; justify-content:center; } .welcome .art svg.i { width:30px; height:30px; }
.welcome h2 { font-size:21px; margin:16px 0 6px; letter-spacing:-.01em; } .welcome p { margin:0; color:var(--ink-3); } .chips { display:flex; flex-direction:column; gap:8px; margin-top:20px; }
.chips button { justify-content:flex-start; text-align:left; font-weight:500; min-height:42px; height:auto; padding:8px 14px; }
.empty { padding:40px 20px; text-align:center; color:var(--ink-3); } .skel { padding:14px 16px; border-bottom:1px solid var(--line); } .skel i { display:block; height:10px; border-radius:6px; margin:7px 0; background:linear-gradient(90deg, var(--soft), var(--line), var(--soft)); background-size:200% 100%; animation:shim 1.2s infinite; } .skel i:nth-child(1) { width:45%; } .skel i:nth-child(2) { width:90%; } @keyframes shim { to { background-position:-200% 0; } }

/* side panel */
.panel { padding:16px; border-bottom:1px solid var(--line); } .panel h3 { margin:0 0 10px; font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-3); display:flex; align-items:center; gap:7px; } .panel h3 svg.i { width:14px; height:14px; }
.kv { display:flex; justify-content:space-between; gap:10px; padding:6px 0; font-size:13.5px; } .kv dt { color:var(--ink-3); } .kv dd { margin:0; text-align:right; font-weight:600; overflow-wrap:anywhere; }
.chip { display:inline-block; font-size:12.5px; padding:2px 9px; border-radius:99px; background:var(--surface); border:1px solid var(--line-2); margin:0 4px 4px 0; }
.tl { list-style:none; margin:0; padding:0 0 0 6px; border-left:2px solid var(--line); } .tl li { position:relative; margin:0 0 12px 14px; font-size:13px; } .tl li::before { content:""; position:absolute; left:-21px; top:5px; width:10px; height:10px; border-radius:50%; background:var(--go); box-shadow:0 0 0 3px var(--sunken); }
.tl li.bad::before { background:var(--bad); } .tl li.warn::before { background:var(--warn); } .tl .st { font-weight:650; color:var(--ink); } .tl .n { display:inline-block; font-size:11px; font-weight:700; color:var(--brand); background:var(--brand-bg); border-radius:5px; padding:0 5px; margin-right:6px; } .tl .d { color:var(--ink-2); } .tl .t { color:var(--ink-3); font-size:12px; }

dialog { border:1px solid var(--line); border-radius:14px; padding:22px; max-width:560px; width:calc(100% - 24px); background:var(--surface); color:var(--ink); } dialog::backdrop { background:rgba(16,24,40,.45); }
dialog h3 { margin:0 0 10px; font-size:18px; } dialog label { display:block; margin:10px 0; font-weight:600; font-size:13.5px; } dialog label input, dialog label textarea, dialog label select { width:100%; margin-top:5px; font-weight:400; }
dialog .err { color:var(--bad); min-height:1.2em; margin:6px 0 0; font-size:13.5px; } dialog .row { display:flex; gap:8px; justify-content:flex-end; margin-top:12px; }
.toasts { position:fixed; right:16px; bottom:16px; display:flex; flex-direction:column; gap:8px; z-index:60; } .toast { background:var(--ink); color:var(--bg); padding:10px 14px; border-radius:8px; max-width:420px; font-size:14px; box-shadow:0 6px 20px rgba(0,0,0,.25); } .toast.bad { background:var(--bad); color:#fff; }

@media (max-width:1180px) { .app { grid-template-columns:minmax(280px, 330px) minmax(0,1fr); } .side { display:none; } }
@media (max-width:820px) {
  header.top { padding:0 10px; gap:8px; } .crumb, .brand .bt, .linkout { display:none; } .namebox { width:120px; } .seg button { padding:0 9px; font-size:13px; }
  .app { grid-template-columns:minmax(0,1fr); } .col.thread { display:none; } .app.reading .convs { display:none; } .app.reading .col.thread { display:flex; }
  .backlink { display:inline-flex; } .msgs { padding:14px 12px; } .composer { padding:10px 12px; } .msg { max-width:96%; } }

/* ===================================================================== expand / collapse + the Details tab */
.ttabs { display:flex; gap:4px; padding:0 20px; background:var(--surface); border-bottom:1px solid var(--line); }
.ttabs button { border:0; border-bottom:2px solid transparent; border-radius:0; box-shadow:none; min-height:42px; background:none; color:var(--ink-3); }
.ttabs button:hover:not(:disabled) { background:none; color:var(--ink); }
.ttabs button[aria-selected="true"] { color:var(--brand); border-bottom-color:var(--brand); }
.ttabs button svg.i { width:16px; height:16px; }
.dpane { flex:1; overflow:auto; padding:16px 24px 28px; background:var(--bg); display:flex; flex-direction:column; gap:12px; }
.dpane > * { width:100%; max-width:880px; align-self:center; }
.dtools { display:flex; gap:8px; justify-content:flex-end; } .dtools button { min-height:32px; font-size:13px; box-shadow:none; }
.dsec { background:var(--surface); border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--shadow); overflow:hidden; }
.dsec-h { width:100%; justify-content:flex-start; gap:10px; border:0; border-radius:0; box-shadow:none; background:none; min-height:48px; padding:0 16px; color:var(--ink); }
.dsec-h:hover:not(:disabled) { background:var(--sunken); }
.dsec-h .tt { font-size:14.5px; font-weight:650; } .dsec-h .meta { margin-left:auto; display:inline-flex; gap:8px; align-items:center; font-weight:500; font-size:13px; color:var(--ink-3); }
.dsec-h .chev { display:inline-flex; transition:transform .15s; color:var(--ink-3); } .dsec-h > svg.i { color:var(--ink-3); }
.dsec.closed .chev { transform:rotate(-90deg); } .dsec.closed .dsec-b { display:none; }
.dsec-b { padding:4px 16px 16px; border-top:1px solid var(--line); }
.dsec-b .kv:first-child { padding-top:10px; }
.src-h { width:100%; justify-content:flex-start; gap:6px; background:none; border:0; box-shadow:none; min-height:30px; padding:0; font-size:11.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-3); }
.src-h:hover:not(:disabled) { background:none; color:var(--ink); } .src-h .chev { display:inline-flex; transition:transform .15s; } .src-h svg.i { width:14px; height:14px; }
.src-h .cnt { background:var(--soft); color:var(--ink-2); border-radius:99px; padding:0 7px; font-size:11px; letter-spacing:0; }
.src.closed .chev { transform:rotate(-90deg); } .src.closed .src-b { display:none; }
.thead .focusbtn { flex:none; }
.rail { display:none; flex-direction:column; align-items:center; gap:10px; padding:12px 0; overflow-y:auto; height:100%; }
.rail .rail-list { display:flex; flex-direction:column; gap:8px; align-items:center; margin-top:6px; padding-top:12px; border-top:1px solid var(--line); width:100%; }
.rail-av { position:relative; width:44px; min-height:44px; height:44px; padding:0; border:0; background:none; box-shadow:none; border-radius:50%; }
.rail-av:hover:not(:disabled) { background:none; } .rail-av .avatar { width:40px; height:40px; font-size:13px; }
.rail-av[aria-current="true"] .avatar { box-shadow:0 0 0 2px var(--surface), 0 0 0 4px var(--brand-solid); }
.rail-av .dot { position:absolute; right:1px; bottom:1px; width:11px; height:11px; border-radius:50%; background:var(--ink-3); border:2px solid var(--surface); }
.rail-av .dot.ok { background:var(--go); } .rail-av .dot.warn { background:var(--warn); } .rail-av .dot.bad { background:var(--bad); } .rail-av .dot.team { background:var(--teamc); } .rail-av .dot.info { background:var(--brand-solid); }
@media (min-width:821px) {
  .app { grid-template-columns:var(--lw, 360px) minmax(0,1fr); transition:grid-template-columns .2s ease; }
  .app.listcollapsed { --lw:64px; } .app.listcollapsed .colhead, .app.listcollapsed .list { display:none; } .app.listcollapsed .rail { display:flex; }
  .app.focus { grid-template-columns:minmax(0,1fr); } .app.focus .convs { display:none; }
  body.focus header.top { display:none; } body.focus .app { height:100vh; }
}
@media (max-width:820px) { .collapse-btn, .focusbtn, .rail { display:none !important; } .ttabs { padding:0 12px; } .dpane { padding:12px; } .dsec-h { padding:0 12px; } }

async function api(path, body) {
  const res = await fetch(path, body === undefined ? {} : {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});
  return {ok: res.ok, status: res.status, data: await res.json().catch(() => ({}))};
}
async function job(started, onStep) {
  if (!started.ok) return {ok: false, error: started.data.error || "Could not start"};
  const id = started.data.job_id; let since = started.data.since ?? 0;
  for (;;) {
    await new Promise(r => setTimeout(r, 450));
    const p = await api(`/api/jobs/${id}?since=${since}`);
    if (!p.ok) return {ok: false, error: p.data.error || "Lost track of the job"};
    since = Math.max(since, (p.data.last_seq || since) - 1);
    const steps = p.data.steps || []; if (steps.length && onStep) onStep(steps.at(-1).text);
    const j = p.data.job;
    if (j.status === "done") return {ok: true, result: j.result};
    if (j.status === "failed") return {ok: false, error: j.error || "Failed"};
  }
}

// ---------------------------------------------------------------- formatting
const clock = d => `${d.getHours() % 12 || 12}:${String(d.getMinutes()).padStart(2, "0")} ${d.getHours() >= 12 ? "PM" : "AM"}`;

  return diff === 0 ? `Today, ${clock(d)}` : diff === 1 ? `Yesterday, ${clock(d)}` : `${d.getDate()} ${d.toLocaleString("en-US", {month: "short"})}, ${clock(d)}`; }
function ago(v) { const d = new Date(v); if (!v || isNaN(d)) return ""; const s = Math.round((Date.now() - d) / 1000);
  return s < 60 ? "now" : s < 3600 ? `${Math.round(s / 60)}m` : s < 86400 ? `${Math.round(s / 3600)}h` : s < 7 * 86400 ? `${Math.round(s / 86400)}d` : `${d.getDate()} ${d.toLocaleString("en-US", {month: "short"})}`; }

  return diff === 0 ? "Today" : diff === 1 ? "Yesterday" : d.toLocaleDateString("en-US", {weekday: "long", day: "numeric", month: "short"}); };

  .replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g, '$1<a href="$2" target="_blank" rel="noopener">$2</a>'); }
function markdown(text) {

  for (const line of esc(text || "").split("\n")) { const h = line.match(/^#{1,3}\s+(.*)/), li = line.match(/^(?:[-*]|\d+\.)\s+(.*)/);
    if (h) { close(); out += `<h4>${inline(h[1])}</h4>`; } else if (li) { if (!list) { out += "<ul>"; list = true; } out += `<li>${inline(li[1])}</li>`; }

}

  const b = $("#collapselist"); if (b) { b.setAttribute("aria-expanded", String(!LISTCOL)); }
}
function toggleList() { LISTCOL = !LISTCOL; store.set("listcol", LISTCOL); if (FOCUS) FOCUS = false; applyLayout(); renderThread(true); }
function setFocus(on) { FOCUS = on; applyLayout(); renderThread(true); }
function setTab(t) { if (!CUR || t === TAB) return; TAB = t; store.set("tab", TAB); renderThread(false); }

// ---------------------------------------------------------------- loading
async function loadList() {
  let r; try { r = await api("/api/chat/conversations"); } catch { r = {ok: false, status: 0, data: {}}; }
  if (r.status === 404) { document.body.innerHTML = '<div style="padding:60px;text-align:center;font-family:system-ui"><h2>Chat is switched off</h2><p>Ask your administrator to set CHAT_ENABLED=true.</p><p><a href="/kb">Open the review console</a></p></div>'; return; }
  ERR = r.ok ? "" : "Could not load the chats. The server may have stopped.";
  if (r.ok) { LIST = r.data.items; lastVersion = r.data.version; }
  LOADED = true; renderList();
}
async function loadCurrent(keepScroll) {
  if (!CURID) { CUR = null; renderThread(); renderSide(); return; }
  const r = await api(`/api/chat/conversations/${CURID}`);
  if (r.ok) CUR = r.data; else if (r.status === 404) { CUR = null; CURID = ""; }
  renderThread(keepScroll); renderSide(); renderList();
}
async function open(id) {
  CURID = id; CUR = null; history.replaceState(null, "", id ? `?c=${id}` : location.pathname);
  $("#app").classList.toggle("reading", !!id); renderList(); renderThread(); await loadCurrent(false);
}
async function loadStatus() { const r = await api("/api/chat/status"); if (r.ok) STATUS = r.data; }

// ---------------------------------------------------------------- acting
function myName() { return NAME.trim() || (isTeam() ? "Kroger Data Team" : "You"); }
function track(id, started) {
  WORKING[id] = "Understanding the question"; if (CURID === id) renderThread(true); renderList();
  job(started, step => { WORKING[id] = step; if (CURID === id) renderThread(true); }).then(async out => {
    delete WORKING[id]; if (!out.ok) toast(out.error || "The agent could not finish.", "bad");
    await loadList(); if (CURID === id) await loadCurrent(true);
  });
}
// UC Concierge, the suite's front door, opens /chat?q=<request>&from=concierge (canonical copy of these two functions:
// uc-concierge-front-door/agent-patches/prefill/concierge-prefill.js).
// --- UC Concierge hand-off
function takeConciergeRequest(href) {
  const url = new URL(href);
  if (url.searchParams.get("from") !== "concierge") return null;
  const q = (url.searchParams.get("q") || "").trim();
  if (!q) return null;
  url.searchParams.delete("q");
  url.searchParams.delete("from");
  return { q, cleanUrl: url.pathname + url.search + url.hash };
}
function fitRequest(q, maxLength) {
  if (!maxLength || q.length <= maxLength) return { text: q, cut: false };
  return { text: q.slice(0, maxLength), cut: true };
}
// --- end UC Concierge hand-off
// Asks the handed-over question once, always as a new chat; the address loses q/from first, so a reload never asks again.
function conciergeHandoff() {
  const handoff = takeConciergeRequest(location.href);
  if (!handoff) return;
  history.replaceState(null, "", handoff.cleanUrl);
  if (CURID) { CURID = ""; CUR = null; history.replaceState(null, "", location.pathname); renderThread(); renderSide(); }
  const ta = $("#msgtext");
  const fit = fitRequest(handoff.q, Number(ta?.getAttribute("maxlength")) || 4000);
  toast(fit.cut ? "From UC Concierge. Your question was shortened to fit; check it, then send." : "From UC Concierge");
  if (fit.cut) { if (ta) { ta.value = fit.text; ta.focus(); } return; }
  send(fit.text);
}
async function send(textArg) {
  const ta = $("#msgtext"), text = (textArg ?? ta?.value ?? "").trim(); if (!text) return;
  if (ta) { ta.value = ""; ta.style.height = ""; }
  const who = {name: NAME.trim() || "", as: isTeam() ? "team" : "user"};
  if (!CURID) {
    const r = await api("/api/chat/conversations", {text, ...who}); if (!r.ok) { toast(r.data.error || "Could not start the chat.", "bad"); if (ta) ta.value = text; return; }
    CURID = r.data.conversation.id; CUR = r.data.conversation; history.replaceState(null, "", `?c=${CURID}`); $("#app").classList.add("reading");
    track(CURID, r); await loadList(); renderThread(); renderSide(); return;
  }
  const r = await api(`/api/chat/conversations/${CURID}/messages`, {text, ...who});
  if (!r.ok) { toast(r.data.error || "Could not send.", "bad"); if (ta) ta.value = text; return; }
  CUR = r.data.conversation || CUR; renderThread(false); renderSide();
  if (r.status === 202) track(CURID, r); else loadList();
}
async function team(action) {
  const name = NAME.trim();
  if (!name) { toast("Enter your name at the top first, so the chat shows who is helping.", "bad"); $("#myname").focus(); return; }
  const base = `/api/chat/conversations/${CURID}`;
  if (action === "resolve") { const r = await api(base + "/resolve", {name}); if (!r.ok) return toast(r.data.error || "Could not resolve.", "bad"); toast("Marked as resolved."); CUR = r.data.conversation; renderThread(true); renderSide(); return loadList(); }
  if (action === "approve") { const r = await api(base + "/validate", {approve: true, as: "team", name}); if (!r.ok) return toast(r.data.error, "bad"); toast("Question approved."); CUR = r.data.conversation; renderThread(false); renderSide(); return loadList(); }
  if (action === "decline") {
    if (!await ask({title: "Decline this question?", ok: "Decline", body: '<label>Reply to the person <small class="muted">they see this in the chat</small><textarea id="dn" rows="3" placeholder="e.g. This one belongs to the platform team."></textarea></label>'})) return;
    const r = await api(base + "/validate", {approve: false, note: $("#dn").value.trim(), as: "team", name}); if (!r.ok) return toast(r.data.error, "bad");
    CUR = r.data.conversation; renderThread(false); renderSide(); return loadList();
  }
  const found = action === "answer";
  if (!await ask({title: found ? "Post the answer" : "No answer yet", ok: found ? "Post to the chat" : "Raise a ticket",
    body: found ? '<label>Answer <small class="muted">shown to the person as the Kroger Data Team</small><textarea id="an" rows="6" placeholder="Write the answer. Markdown works: **bold**, - bullets, [text](url)."></textarea></label>'
      : '<p class="muted">The person is told the team has no answer yet. Agent and team are emailed about the ticket.</p><label>Ticket <small class="muted">optional, e.g. JIRA-123</small><input id="tk" type="text"></label>',
    check: d => found && !d.querySelector("#an").value.trim() ? "Write the answer first." : ""})) return;
  const r = await api(base + "/answer", {found, text: found ? $("#an").value : "", ticket: found ? "" : $("#tk").value.trim(), as: "team", name});
  if (!r.ok) return toast(r.data.error, "bad");
  WORKING[CURID] = found ? "Posting the answer" : "Raising the ticket"; renderThread(true);
  const id = CURID, out = await job(r, step => { WORKING[id] = step; if (CURID === id) renderThread(true); }); delete WORKING[id];
  if (!out.ok) toast(out.error, "bad"); else toast(found ? "Answer posted." : "Ticket noted.");
  await loadList(); if (CURID === id) await loadCurrent(true);
}
function wire() {
  const ta = $("#msgtext"), ms = $("#msgs"), jb = $("#jump");
  if (ms && jb) { const upd = () => jb.classList.toggle("show", ms.scrollHeight - ms.scrollTop - ms.clientHeight > 160); ms.onscroll = upd; upd();
    jb.onclick = () => ms.scrollTo({top: ms.scrollHeight, behavior: "smooth"}); }
  if (ta && !CURID && matchMedia("(min-width:821px)").matches) setTimeout(() => ta.focus(), 0);
  if (ta) { ta.oninput = () => { ta.style.height = "auto"; ta.style.height = Math.min(ta.scrollHeight, 160) + "px"; };
    ta.onkeydown = e => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); } }; }
}

// ---------------------------------------------------------------- events
$("#thread").addEventListener("click", async e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.id === "sendbtn") return send();
  if (b.dataset.suggest) return send(b.dataset.suggest);
  if (b.dataset.back) { $("#app").classList.remove("reading"); return; }
  if (b.dataset.t) return team(b.dataset.t);
  if (b.dataset.retryChat) { const r = await api(`/api/chat/conversations/${CURID}/retry`, {}); if (!r.ok) return toast(r.data.error, "bad"); CUR = r.data.conversation; track(CURID, r); }
});
function dropped(ids) {
  for (const id of ids) delete WORKING[id];
  if (CURID && ids.includes(CURID)) { CURID = ""; CUR = null; history.replaceState(null, "", location.pathname); renderThread(); renderSide(); }
}
async function deleteChat(id) {
  const c = LIST.find(x => x.id === id);
  if (!confirm(`Delete this chat?\n\n${c ? c.title : id}\n\nThis cannot be undone.`)) return;
  const r = await api(`/api/chat/conversations/${id}/delete`, {});
  if (!r.ok && r.status !== 404) return toast(r.data.error || "Could not delete the chat.", "bad");
  dropped([id]); await loadList(); toast("Chat deleted.");
}
$("#list").addEventListener("click", e => {
  const d = e.target.closest("[data-del]"); if (d) { e.stopPropagation(); return deleteChat(d.dataset.del); }
  const c = e.target.closest(".conv"); if (c) open(c.dataset.id); if (e.target.closest("[data-retry]")) loadList();
});
$("#list").addEventListener("keydown", e => { const d = e.target.closest("[data-del]"); if (d && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); e.stopPropagation(); deleteChat(d.dataset.del); } });
$("#clearall").addEventListener("click", async () => {
  if (!LIST.length) return toast("There are no chats to delete.");
  if (!confirm(`Delete all ${LIST.length} chat(s)?\n\nThis cannot be undone.`)) return;
  const r = await api("/api/chat/clear", {});
  if (!r.ok) return toast(r.data.error || "Could not delete the chats.", "bad");
  dropped(LIST.map(x => x.id)); await loadList(); toast("All chats deleted.");
});
$("#filters").addEventListener("click", e => { const b = e.target.closest("[data-f]"); if (b) { FILTER = b.dataset.f; renderList(); } });
$("#q").addEventListener("input", e => { QUERY = e.target.value; renderList(); });
$("#newchat").addEventListener("click", () => { CURID = ""; CUR = null; history.replaceState(null, "", location.pathname); $("#app").classList.add("reading"); renderList(); renderThread(); renderSide(); $("#msgtext")?.focus(); });
$("#reload").addEventListener("click", async () => { await loadList(); await loadStatus(); if (CURID) await loadCurrent(true); toast("Up to date."); });
// HIDDEN (the switch and the name box are commented out in the header above):
// $("#roleseg").addEventListener("click", e => { const b = e.target.closest("[data-role]"); if (!b) return; ROLE = b.dataset.role; store.set("role", ROLE); applyRole(); });
// $("#myname").addEventListener("input", e => { NAME = e.target.value; store.set("name", NAME); renderFilters(); });
function applyRole() {
  document.querySelectorAll("#roleseg [data-role]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.role === ROLE)));
  $("#newchat").classList.toggle("hidden", isTeam()); FILTER = isTeam() ? "team" : "all";
  if (isTeam() && !CURID) { $("#app").classList.remove("reading"); } renderList(); renderThread(true); renderSide();
}
$("#thread").addEventListener("click", async e => {
  const b = e.target.closest("[data-copy]"); if (!b) return;
  try { await navigator.clipboard.writeText(plain(MSGTEXT[b.dataset.copy] || "")); b.innerHTML = `${ic("check")}Copied`; setTimeout(() => { b.innerHTML = `${ic("file")}Copy`; }, 1800); }
  catch { toast("Could not copy. Select the text and copy it.", "bad"); }
});
// expand / collapse: panels, sections, sources, the tabs and their keys
$("#collapselist").addEventListener("click", toggleList);
$("#rail").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.rail === "expand") return toggleList();
  if (b.dataset.rail === "new") { LISTCOL = false; store.set("listcol", false); applyLayout(); return $("#newchat").click(); }
  if (b.dataset.id) open(b.dataset.id);
});
$("#thread").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.tab) return setTab(b.dataset.tab);
  if (b.dataset.focus) return setFocus(!FOCUS);
  if (b.dataset.src) {
    const box = b.closest(".src"), open = box.classList.contains("closed");
    box.classList.toggle("closed", !open); b.setAttribute("aria-expanded", String(open)); SRCOPEN[b.dataset.src] = open; return;
  }
  if (b.dataset.sec) {
    const box = b.closest(".dsec"), open = box.classList.contains("closed");
    box.classList.toggle("closed", !open); b.setAttribute("aria-expanded", String(open)); SECS[b.dataset.sec] = open; store.set("secs", SECS); return;
  }
  if (b.dataset.secall) {
    const open = b.dataset.secall === "open";
    document.querySelectorAll(".dsec").forEach(box => { const h = box.querySelector(".dsec-h"); box.classList.toggle("closed", !open); h.setAttribute("aria-expanded", String(open)); SECS[h.dataset.sec] = open; });
    store.set("secs", SECS);
  }
});
document.addEventListener("keydown", e => {
  if ($("#dlg").open) return;
  if (e.key === "Escape" && FOCUS) { setFocus(false); return; }
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const t = e.target; if (t && ["INPUT", "TEXTAREA", "SELECT"].includes(t.tagName)) return;
  if (e.key === "[") toggleList();
  else if (e.key === "]") setTab(TAB === "chat" ? "details" : "chat");
  else if (e.key.toLowerCase() === "f") setFocus(!FOCUS);
});
// keep the page current: only re-read when something changed on the server, never while the person is typing
setInterval(async () => {
  const r = await api("/api/chat/status"); if (!r.ok) return; STATUS = r.data;
  if (r.data.version !== lastVersion) { const typing = document.activeElement && document.activeElement.id === "msgtext" && document.activeElement.value;
    await loadList(); if (CURID && !typing && !WORKING[CURID]) await loadCurrent(true); }
}, 3000);

// ---------------------------------------------------------------- Teams link (post a request in the channel)
function setTeamsLink(l) {
  const a = $("#teamslink"); if (!a || !l || !l.url) return false;
  a.href = l.url; a.hidden = false;
  if (l.name) { a.title = `Post a request in Teams (${l.name})`; a.setAttribute("aria-label", `Post a request in Teams, ${l.name} channel`); }
  return true;
}
async function showTeamsLink() {
  try {
    const r = await api("/api/chat/teams-link");
    if (r.ok && setTeamsLink(r.data)) return;
    const s = await api("/api/chat/teams-link", {});          // ask Graph once; the server remembers the answer
    if (!s.ok) return;
    const j = await job(s); if (j.ok) setTeamsLink(j.result);
  } catch (e) { /* no link: the icon stays hidden */ }
}

// ---------------------------------------------------------------- start
// HIDDEN (name box): $("#myname").value = NAME;
// With the switch hidden the page is always the Data user view, even if this browser once saved the team view.
ROLE = "user";
(async () => {
  const s = await api("/api/chat/suggestions"); if (s.ok && s.data.questions.length) SUGGESTIONS = s.data.questions;
  // HIDDEN (Teams link): showTeamsLink();
  applyLayout();
  await loadStatus(); await loadList(); applyRole();
  if (CURID) { $("#app").classList.add("reading"); await loadCurrent(false); } else { renderThread(); renderSide(); }
  conciergeHandoff();
})();
</script>
