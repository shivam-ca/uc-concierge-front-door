<style>

* { box-sizing:border-box; }

:focus-visible { outline:2px solid var(--focus); outline-offset:2px; }

/* page header */
header.top { background:#084282; color:#fff; }
header.top .in { max-width:1180px; margin:0 auto; padding:10px 20px; display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
.brand { display:flex; align-items:center; gap:10px; min-width:0; }
.logo { width:34px; height:34px; border-radius:9px; background:rgba(255,255,255,.14); display:grid; place-items:center; }
.brand h1 { font-size:17px; margin:0; font-weight:650; letter-spacing:.01em; }

.spacer { flex:1; }
.chips { display:flex; gap:6px; flex-wrap:wrap; }
.hchip { display:inline-flex; align-items:center; gap:7px; padding:5px 12px; border-radius:99px; border:1px solid rgba(255,255,255,.22); background:rgba(255,255,255,.08); color:#fff; font-size:13px; }
.hchip .d { width:8px; height:8px; border-radius:50%; background:#9fb3cc; }
.hchip.ok .d { background:#5fd08f; } .hchip.bad .d { background:#ff8a80; } .hchip.checking .d { animation:pulse 1.1s infinite; }

.iconbtn:hover { background:rgba(255,255,255,.12); }

main { max-width:1180px; margin:0 auto; padding:24px 20px 56px; }
.card { background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); }

.banner.bad { background:var(--bad-soft); }

/* title row */
.head { display:flex; align-items:flex-end; gap:12px 18px; flex-wrap:wrap; margin-bottom:16px; }
.head h2 { margin:0; font-size:24px; letter-spacing:-.01em; }
.head p { margin:3px 0 0; color:var(--ink-3); max-width:60ch; }

.qb:hover { background:var(--pend-soft); } .qb[disabled] { opacity:.5; cursor:default; } .qb:focus-visible { outline:2px solid var(--focus); }
.pop { position:absolute; top:calc(100% + 8px); right:0; z-index:30; width:min(380px, 90vw); padding:14px 16px; font-size:13px; line-height:1.55; color:var(--ink-2); text-align:left; }
.pop h3 { margin:0 0 4px; font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-3); } .pop p { margin:0 0 10px; } .pop p:last-child { margin:0; }
.card.pop { box-shadow:var(--shadow-lg); }

.cbox:focus-within { border-color:var(--focus); box-shadow:0 0 0 3px color-mix(in srgb, var(--focus) 25%, transparent); }
.sbox .mag { position:absolute; left:12px; top:14px; color:var(--ink-3); pointer-events:none; }
.cbox input { all:unset; flex:1 1 170px; min-width:120px; padding:6px 2px; font-size:15px; }
.cbox input::placeholder { color:var(--ink-3); }
.tag { display:inline-flex; align-items:center; gap:6px; max-width:100%; padding:3px 5px 3px 11px; border-radius:99px; background:var(--brand-soft); font-size:13.5px; }
.tag span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.tag button { all:unset; cursor:pointer; width:20px; height:20px; display:grid; place-items:center; border-radius:50%; color:var(--ink-3); }
.tag button:hover { background:var(--line); color:var(--ink); } .tag button:focus-visible { outline:2px solid var(--focus); }
.sug { position:absolute; left:0; right:0; top:calc(100% + 6px); z-index:20; max-height:340px; overflow:auto; padding:6px; }
.sug .grp { padding:8px 10px 4px; font-size:11.5px; font-weight:650; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-3); }

.sug button:hover, .sug button[aria-selected="true"] { background:var(--brand-soft); }
.sug .n { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; } .sug .m { color:var(--ink-3); font-size:12.5px; white-space:nowrap; }
.sug .none { padding:12px 10px; color:var(--ink-3); }
.sel { padding:0 30px 0 12px; min-height:46px; border:1px solid var(--line-2); border-radius:11px; background:var(--surface); box-shadow:var(--shadow); cursor:pointer; appearance:none; -webkit-appearance:none;
  background-image:linear-gradient(45deg, transparent 50%, var(--ink-3) 50%), linear-gradient(135deg, var(--ink-3) 50%, transparent 50%); background-position:calc(100% - 17px) 20px, calc(100% - 12px) 20px; background-size:5px 5px; background-repeat:no-repeat; }
.clear { all:unset; cursor:pointer; align-self:center; color:var(--brand); font-size:14px; padding:6px 4px; } .clear:hover { text-decoration:underline; } .clear:focus-visible { outline:2px solid var(--focus); }
code { font-family:Consolas, "Cascadia Mono", monospace; font-size:12.5px; background:var(--pend-soft); padding:1px 5px; border-radius:5px; color:var(--ink-2); word-break:break-all; }

/* search + live action */

.lb-src { display:flex; align-items:center; gap:8px; color:var(--ink-2); font-size:14px; }
.lb-dot { width:9px; height:9px; border-radius:50%; background:var(--pend); flex:none; } .lb-dot.live { background:var(--go); } .lb-dot.run { background:var(--warn); animation:pulse 1s infinite; }
.lb-act { margin-left:auto; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.lb-msg { color:var(--ink-2); font-size:13.5px; max-width:48ch; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; } .lb-msg.bad { color:var(--bad); white-space:normal; }

.btn { display:inline-flex; align-items:center; gap:8px; padding:9px 15px; border-radius:9px; border:1px solid var(--brand); background:var(--brand); color:var(--brand-ink); cursor:pointer; font-size:14.5px; font-weight:600; }
.btn:hover { filter:brightness(1.08); } .btn:focus-visible { outline:2px solid var(--focus); outline-offset:2px; }
.btn.alt { background:var(--surface); color:var(--ink); border-color:var(--line-2); box-shadow:var(--shadow); font-weight:500; } .btn.alt:hover { background:var(--surface-2); filter:none; }
.spin { display:inline-block; width:14px; height:14px; border:2px solid var(--line-2); border-top-color:var(--warn); border-radius:50%; animation:spin .9s linear infinite; }

/* table card */
.th { display:flex; align-items:center; gap:10px 14px; flex-wrap:wrap; padding:13px 18px; border-bottom:1px solid var(--line); }
.cn { display:flex; gap:6px; flex-wrap:wrap; align-items:center; }

.legend { display:flex; flex-wrap:wrap; align-items:center; gap:4px 16px; color:var(--ink-3); font-size:13px; padding-left:12px; border-left:1px solid var(--line-2); }
.legend[hidden] { display:none; }

@media (max-width:760px) { .legend { border-left:0; padding-left:0; width:100%; } }
.os { color:var(--ink-3); font-size:12px; font-weight:600; letter-spacing:.02em; white-space:nowrap; }
.cnt.bad { background:var(--bad-soft); color:var(--bad); } .cnt.src { background:var(--brand-soft); color:var(--ink); }

.tw { overflow:auto; }
table { border-collapse:collapse; width:100%; min-width:940px; }
th, td { padding:13px 16px; text-align:left; border-bottom:1px solid var(--line); vertical-align:top; }

th.r, td.r { text-align:right; }
th button { all:unset; cursor:pointer; display:inline-flex; gap:5px; align-items:center; text-transform:inherit; letter-spacing:inherit; }
th button:focus-visible { outline:2px solid var(--focus); outline-offset:2px; }
th .ar { opacity:.35; font-size:10px; } th[aria-sort] .ar { opacity:1; }
tbody tr.row:hover td { background:var(--surface-2); }
.nm { font-weight:650; word-break:break-word; } .em { color:var(--ink-3); font-size:12.5px; word-break:break-all; }
.chip { display:inline-flex; align-items:center; gap:6px; padding:3px 10px; border-radius:99px; font-size:12.5px; font-weight:600; white-space:nowrap; }
.chip.bad { background:var(--bad-soft); color:var(--bad); } .chip.warn { background:var(--warn-soft); color:var(--warn); }

.skel { padding:14px 18px; } .skel i { display:block; height:16px; border-radius:5px; background:var(--pend-soft); margin:18px 0; animation:pulse 1.2s infinite; }

/* data source picker */
.dsb { position:relative; }
.dsb > button { all:unset; box-sizing:border-box; cursor:pointer; display:inline-flex; align-items:center; gap:8px; min-height:46px; padding:0 34px 0 14px; border:1px solid var(--line-2); border-radius:11px; background:var(--surface); box-shadow:var(--shadow); max-width:290px; position:relative; }
.dsb > button:focus-visible { outline:2px solid var(--focus); outline-offset:2px; }
.dsb > button .t { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.dsb > button::after { content:""; position:absolute; right:14px; top:17px; width:6px; height:6px; border-right:1.5px solid var(--ink-3); border-bottom:1.5px solid var(--ink-3); transform:rotate(45deg); }
.dsb > button.on { background:var(--brand-soft); }
.dsp { position:absolute; left:0; top:calc(100% + 6px); z-index:25; width:min(360px, 92vw); padding:10px; }

.dsl .n { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; } .dsl .m { color:var(--ink-3); font-size:12.5px; white-space:nowrap; }
.dsl .none { padding:12px 8px; color:var(--ink-3); }

/* inline detail */
tr.row.open td { background:var(--surface-2); border-bottom-color:transparent; }
.who { display:flex; gap:8px; align-items:flex-start; }

.dh { margin:6px 0 10px; font-size:13.5px; } .dh b { display:block; font-size:11.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-3); font-weight:600; }
.afind { width:100%; max-width:340px; padding:8px 12px; border:1px solid var(--line-2); border-radius:9px; background:var(--surface); margin-bottom:10px; min-height:38px; }
.al { border:1px solid var(--line); border-radius:9px; overflow:auto; max-height:340px; background:var(--surface); }
.al table { min-width:820px; } .al th, .al td { padding:7px 10px; font-size:13px; } .al thead th { top:0; }
.al td.p { word-break:break-all; }
.lv { padding:1px 8px; border-radius:99px; background:var(--pend-soft); color:var(--pend); font-size:12px; }
.cp { all:unset; cursor:pointer; color:var(--ink-3); padding:2px 4px; border-radius:5px; } .cp:hover { background:var(--pend-soft); color:var(--ink); } .cp:focus-visible { outline:2px solid var(--focus); }

/* clean layout */
.head { align-items:center; margin-bottom:16px; }
.head h2 { font-size:26px; letter-spacing:-.015em; }
.icn { all:unset; cursor:pointer; width:34px; height:34px; display:grid; place-items:center; border-radius:8px; color:var(--ink-3); }
.icn:hover { background:var(--pend-soft); color:var(--ink); } .icn:focus-visible { outline:2px solid var(--focus); outline-offset:1px; } .icn[disabled] { opacity:.5; cursor:default; }
.finder { margin-bottom:20px; }
.search { position:relative; display:flex; align-items:center; gap:6px; padding:5px 5px 5px 42px; background:var(--surface); border:1px solid var(--line-2); border-radius:14px; box-shadow:var(--shadow); max-width:880px; }

.sel, .dsb > button { min-height:36px; border-radius:9px; box-shadow:none; font-size:14px; }

.dsb > button { padding:0 30px 0 11px; max-width:230px; } .dsb > button::after { top:13px; right:12px; }
.clear { align-self:center; }

/* use the width of the screen */
header.top .in, main { max-width:1840px; padding-left:clamp(14px, 2vw, 36px); padding-right:clamp(14px, 2vw, 36px); }
.search, .livebar { max-width:none; }

/* UX review fixes */

/* theme */

/* what the counts count: with table level off they are schemas (and catalogs, when there are any), not "assets" */
/* a person followed by their mark: "Barry, Riley W (O)" shows the (O) quietly; (S) is a steward, (O, S) both */
const tagBadges = t => String(t).split(/,\s*/).filter(x => x === "O" || x === "S").map(x => '<span class="tg ' + x.toLowerCase() + '" title="' + (x === "O" ? "Owner" : "Steward") + '" aria-label="' + (x === "O" ? "Owner" : "Steward") + '">' + x + '</span>').join("");
const person = n => { const m = /^(.*) \(([OS](?:, S)?)\)$/.exec(String(n)); return m ? esc(m[1]) + ' <span class="tgs">' + tagBadges(m[2]) + '</span>' : esc(n); };
/* a data source is shown without its "Group - " prefix ("Krogerlytics - Clickstream Behavioral" shows as "Clickstream Behavioral"); the full name is still what is searched, filtered and sent */
const dsShow = n => { const t = String(n == null ? "" : n), i = t.indexOf(" - "); return i > 0 && t.length > i + 3 ? t.slice(i + 3) : t; };

/* load */
async function load(manual) {
  if (manual) $("#refresh").disabled = true;
  try {
    const res = await fetch("/api/owners/stale?source=" + src);
    const body = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(body.error || res.status + " " + res.statusText);
    D = body;
  } catch (e) {
    $("#tw").innerHTML = '<div class="err"><h3>The stale owners could not be loaded</h3><p>' + esc(e.message) + '</p><p><button class="qb" id="retry" type="button">Try again</button></p></div>';
    const b = $("#retry"); if (b) b.onclick = () => load(true);
    $("#refresh").disabled = false; schedule(15000); return;
  }
  $("#refresh").disabled = false;
  const running = D.live.status === "running" || D.live.status === "queued";
  if (wasRunning && !running && D.live.status === "done" && D.live.has_result && src !== "live") { src = "live"; wasRunning = false; loadIndex(); return load(false); }
  if (wasRunning && !running) wasRunning = false;
  if (running) wasRunning = true;
  render();
  if (!idxAsked) { idxAsked = true; loadIndex(); }
  if (src !== "live" && !D.sources_ready && D.rows.length && !started) {
    started = true;
    fetch("/api/owners/stale/sources", {method:"POST", headers:{"Content-Type":"application/json"}, body:"{}"}).catch(() => {});
  }
  if (!D.health.alation.checked && !checking) {
    checking = true;
    fetch("/api/owners/check", {method:"POST", headers:{"Content-Type":"application/json"}, body:"{}"}).catch(() => {});
  }
  const vrun = D.run.status === "running" || D.run.status === "queued";
  schedule(running ? 1500 : !D.health.alation.checked && checking && ++polls < 15 ? 2000 : src !== "live" && !D.sources_ready && D.rows.length ? 4000 : vrun ? 5000 : 0);
}
function schedule(ms) { clearTimeout(timer); if (ms) timer = setTimeout(() => load(false), ms); }
$("#refresh").onclick = () => load(true);

/* header chips, banner, status stamp and about popover */
function chips() {
  [["alation", "Alation"], ["ad", "Active Directory"]].forEach(([id, label]) => {
    const info = D.health[id], el = $("#chip-" + id);
    el.className = "hchip " + (!info.checked ? "checking" : info.ok ? "ok" : "bad");
    $("#chip-" + id + "-sr").textContent = !info.checked ? "checking" : info.ok ? "connected" : "not connected";

}

    : (r.status === "failed" || r.status === "cancelled") ? '<div class="banner bad" role="status"><b>The last run ' + esc(r.status) + '.</b> These figures come from the results it kept.</div>' : "";
}
function stamp() {
  const r = D.run;
  $("#stamp").textContent = src === "live" ? "Live · checked " + when(r.finished) : r.id ? (r.status === "done" ? "Validated " : "Run " + r.status + " · ") + when(r.finished || r.created) : "";
  const ex = D.excluded || {}, notc = [];

    (notc.length ? '<h3>Not counted</h3><p>' + esc(notc.join(" · ")) + '.</p>' : "") +
    '<h3>Risk</h3><p><b>High</b>: an asset has no valid owner or steward. <b>Medium</b>: every asset still has one, but there is no alternative owner. <b>Low</b>: every asset still has one and an alternative owner exists.</p>' +
    '<h3>Alternative owner</h3><p>The validated people most often recorded on the same assets.</p>' +

$("#info").onclick = e => { e.stopPropagation(); const p = $("#pop"); p.hidden = !p.hidden; $("#info").setAttribute("aria-expanded", String(!p.hidden)); };
document.addEventListener("click", e => { const p = $("#pop"); if (!p.hidden && !p.contains(e.target)) { p.hidden = true; $("#info").setAttribute("aria-expanded", "false"); } });

/* search: chips plus the text being typed, with suggestions from the live data */
function ownerCounts() {
  const m = new Map();
  const add = (kind, label, owner) => { if (!label) return; const k = kind + "|" + label; if (!m.has(k)) m.set(k, new Set()); m.get(k).add(owner); };
  D.rows.forEach(r => {
    r.data_source.forEach(d => add("data source", d, r.owner));
    r.assets.forEach(a => {
      if (a.data_source) add("data source", a.data_source, r.owner);
      if (a.level === "schema") add("schema", a.asset, r.owner);
      if (a.level === "table") { add("table", a.asset, r.owner); add("schema", a.asset.split(".").slice(0, -1).join("."), r.owner); }
    });
  });
  return m;
}
function buildIndex() {
  const counts = ownerCounts(), all = new Map();
  const put = (kind, label) => { if (label && !all.has(kind + "|" + label)) all.set(kind + "|" + label, {kind, label, n: (counts.get(kind + "|" + label) || {size: 0}).size, low: label.toLowerCase()}); };
  counts.forEach((set, k) => { const [kind, ...rest] = k.split("|"); put(kind, rest.join("|")); });
  IDX.sources.forEach(x => put("data source", x.name));
  IDX.assets.forEach(([name, level]) => { if (level === "schema") put("schema", name); else if (level === "table" && D && D.show_tables) { put("table", name); put("schema", name.split(".").slice(0, -1).join(".")); } });
  index = [...all.values()];
}
async function loadIndex() {
  try {
    const res = await fetch("/api/owners/stale/index");
    const j = await res.json();
    IDX = {sources: j.sources || [], assets: j.assets || [], built: j.built, fetched: j.fetched};
    if (j.loading && !checking_idx) { checking_idx = true; fetch("/api/owners/stale/live/sources", {method:"POST", headers:{"Content-Type":"application/json"}, body:"{}"}).catch(() => {}); clearTimeout(idxTimer); idxTimer = setTimeout(loadIndex, 4000); }
  } catch {}
  if (D) { buildIndex(); buildSources(); dsRender(); }
}
let checking_idx = false;
const draft = () => $("#ci").value.trim();
const exactNames = () => terms.filter(t => t.exact).map(t => t.t.toLowerCase());
const containsTerms = () => terms.filter(t => !t.exact).map(t => t.t.toLowerCase()).concat(draft() ? [draft().toLowerCase()] : []);
const active = () => exactNames().concat(containsTerms());
function addTerms(text, exact, kind) {
  String(text).split(exact ? /[\n\r]+/ : /[\n\r,;]+/).map(s => s.trim()).filter(Boolean).forEach(t => {
    if (!terms.some(x => x.t.toLowerCase() === t.toLowerCase() && x.exact === !!exact)) terms.push({t, exact: !!exact, kind: kind || ""});
  });
  $("#ci").value = ""; closeSug(); renderTags(); table();
}
function renderTags() {
  $("#tags").innerHTML = terms.map((t, i) => '<span class="tag ' + (t.exact ? "exact" : "f") + '">' + (t.exact ? '<b>' + esc(t.kind || "name") + '</b>' : '<em>contains</em>') + '<span title="' + esc(t.t) + '">' + esc(t.kind === "data source" ? dsShow(t.t) : t.t) +
    '</span><button type="button" data-rm="' + i + '" aria-label="Remove ' + esc(t.t) + '">' + ic("x") + '</button></span>').join("");
  $("#tags").querySelectorAll("[data-rm]").forEach(b => b.onclick = e => { e.stopPropagation(); terms.splice(Number(b.dataset.rm), 1); renderTags(); table(); $("#ci").focus(); });
  $("#clear").hidden = !(terms.length || fStatus || fRisk || selSrc.length || draft());
  const hint = D && D.show_tables ? "Search a data source, schema or table" : "Search a data source or schema";      // no "table" while table level is off
  $("#ci").placeholder = terms.length ? "Add another…" : hint;
  $("#ci").setAttribute("aria-label", hint);
  if (D) livebar();
}
function suggest(q) {
  const t = q.trim().toLowerCase();
  if (!t) return index.filter(x => x.kind === "data source" && !terms.some(c => c.t.toLowerCase() === x.low)).sort((a, b) => a.label.localeCompare(b.label)).slice(0, 10);
  const hit = index.filter(x => x.low.includes(t) && !terms.some(c => c.t.toLowerCase() === x.low));
  hit.sort((a, b) => (b.low.startsWith(t) - a.low.startsWith(t)) || a.low.length - b.low.length);
  const out = [];
  (D && D.show_tables ? ["data source", "schema", "table"] : ["data source", "schema"]).forEach(k => hit.filter(x => x.kind === k).slice(0, k === "table" ? 4 : 3).forEach(x => out.push(x)));
  return out;
}
function pickSug(x) {
  if (x.kind === "live") { addTerms(x.label, true, "name"); startLive(); }
  else addTerms(x.label, true, x.kind);
}
function showSug() {
  const box = $("#sug"), q = draft();
  sugItems = suggest(q); sugAt = -1;
  if (q) sugItems.unshift({kind: "live", label: q});
  if (!q && !sugItems.length) { closeSug(); return; }
  let h = "", last = "";
  sugItems.forEach((x, i) => {
    if (x.kind !== last) { h += '<div class="grp" role="presentation">' + (x.kind === "live" ? "Search Alation now" : !q && x.kind === "data source" ? "Entire data source" : esc(x.kind) + 's') + '</div>'; last = x.kind; }
    h += x.kind === "live"
      ? '<button type="button" role="option" aria-selected="false" class="live" data-sug="' + i + '"><span class="n">Search live for “' + esc(x.label) + '”</span><span class="m">exact name · reads it from Alation now</span></button>'
      : '<button type="button" role="option" aria-selected="false" data-sug="' + i + '"><span class="n">' + esc(x.kind === "data source" ? dsShow(x.label) : x.label) + '</span><span class="m">' + (x.kind === "data source" ? "entire data source · " : "") + (x.n ? fmt(x.n) + ' stale owner' + (x.n === 1 ? "" : "s") : "no stale owners") + '</span></button>';
  });
  box.innerHTML = h;
  box.hidden = false; $("#ci").setAttribute("aria-expanded", "true");
  box.querySelectorAll("[data-sug]").forEach(b => b.onmousedown = e => { e.preventDefault(); pickSug(sugItems[Number(b.dataset.sug)]); $("#ci").focus(); });
}
function closeSug() { $("#sug").hidden = true; $("#ci").setAttribute("aria-expanded", "false"); sugAt = -1; }
function moveSug(d) {
  const bs = [...$("#sug").querySelectorAll("[data-sug]")]; if (!bs.length) return;
  sugAt = (sugAt + d + bs.length) % bs.length;
  bs.forEach((b, i) => b.setAttribute("aria-selected", String(i === sugAt)));
  bs[sugAt].scrollIntoView({block: "nearest"});
}
$("#cbox").onclick = () => $("#ci").focus();
$("#ci").addEventListener("input", () => { showSug(); renderTags(); table(); });
$("#ci").addEventListener("focus", () => showSug());
$("#ci").addEventListener("blur", () => setTimeout(closeSug, 120));
$("#ci").addEventListener("keydown", e => {
  if (e.key === "ArrowDown") { e.preventDefault(); if ($("#sug").hidden) showSug(); moveSug(1); }
  else if (e.key === "ArrowUp") { e.preventDefault(); moveSug(-1); }
  else if (e.key === "Enter" || e.key === ",") {
    e.preventDefault();
    if (sugAt >= 0 && sugItems[sugAt]) pickSug(sugItems[sugAt]); else if (draft()) addTerms(draft(), false);
  }
  else if (e.key === "Escape") { if (!$("#sug").hidden) closeSug(); else if (draft()) { $("#ci").value = ""; renderTags(); table(); } }
  else if (e.key === "Backspace" && !e.target.value && terms.length) { terms.pop(); renderTags(); table(); }
});
$("#ci").addEventListener("paste", e => { const t = (e.clipboardData || window.clipboardData).getData("text"); if (/[\n\r,;]/.test(t)) { e.preventDefault(); addTerms(t); } });
$("#f-status").onchange = e => { fStatus = e.target.value; renderTags(); table(); };
$("#f-risk").onchange = e => { fRisk = e.target.value; renderTags(); table(); };
$("#clear").onclick = () => { terms = []; selSrc = []; fStatus = fRisk = ""; $("#ci").value = ""; $("#f-status").value = ""; $("#f-risk").value = ""; closeSug(); renderTags(); dsRender(); table(); if (D) livebar(); };

/* data source picker: every data source in the results, chosen from a list */
function buildSources() {
  const stale = new Map();
  D.rows.forEach(r => new Set(r.data_source.concat(r.assets.map(a => a.data_source).filter(Boolean))).forEach(n => { if (!stale.has(n)) stale.set(n, new Set()); stale.get(n).add(r.owner); }));
  const names = new Set([...IDX.sources.map(x => x.name), ...stale.keys()]);
  sources = [...names].sort((a, b) => a.localeCompare(b)).map(name => ({name, n: (stale.get(name) || {size: 0}).size, assets: (IDX.sources.find(x => x.name === name) || {}).assets}));
  selSrc = selSrc.filter(x => sources.some(s => s.name === x));
}
function dsRender() {
  const q = $("#dsf").value.trim().toLowerCase();
  const list = sources.filter(s => !q || s.name.toLowerCase().includes(q));
  $("#dsl").innerHTML = list.length ? list.map(s => '<label><input type="checkbox" data-ds="' + esc(s.name) + '"' + (selSrc.includes(s.name) ? " checked" : "") + '><span class="n" title="' + esc(s.name) + '">' + esc(dsShow(s.name)) +
    '</span><span class="m">' + (s.n ? fmt(s.n) + ' stale owner' + (s.n === 1 ? "" : "s") : "no stale owners") + '</span></label>').join("") : '<div class="none">' + (sources.length ? "No data source matches." : "No data sources yet.") + '</div>';
  $("#dsl").querySelectorAll("[data-ds]").forEach(c => c.onchange = () => { const n = c.dataset.ds, i = selSrc.indexOf(n); i < 0 ? selSrc.push(n) : selSrc.splice(i, 1); dsRender(); renderTags(); table(); if (D) livebar(); });
  $("#ds-c").textContent = selSrc.length ? selSrc.length + " of " + sources.length + " selected" : sources.length + " data source" + (sources.length === 1 ? "" : "s");
  $("#dslabel").textContent = !selSrc.length ? "All data sources" : selSrc.length === 1 ? dsShow(selSrc[0]) : selSrc.length + " data sources";
  $("#dsbtn").className = selSrc.length ? "on" : "";
}
function dsToggle(force) {
  const p = $("#dsp"), show = force == null ? p.hidden : force;
  p.hidden = !show; $("#dsbtn").setAttribute("aria-expanded", String(show));

$("#dsbtn").onclick = e => { e.stopPropagation(); dsToggle(); };

/* scoped rows: the chosen data sources and the search decide which assets count */
function scoped() {
  const ex = exactNames(), ct = containsTerms(), narrowed = ex.length || ct.length || selSrc.length;
  return D.rows.filter(r => (!fStatus || r.status === fStatus) && (!fRisk || r.risk === fRisk)).map(r => {
    if (!narrowed) return {r, assets: r.assets, total: r.total, catalogs: r.catalogs, schemas: r.schemas, tables: r.tables, partial: false, approx: false};
    const assets = r.assets.filter(a => inScope(a.asset, a.data_source, ex, ct));
    if (!assets.length) return null;
    return {r, assets, total: assets.length, catalogs: assets.filter(a => a.level === "catalog").length, schemas: assets.filter(a => a.level === "schema").length, tables: assets.filter(a => a.level === "table").length,
            partial: assets.length < r.total, approx: r.total > r.assets.length};
  }).filter(Boolean);
}
/* an asset is in scope when it is, or sits under, a name that was picked (and in a chosen data source), and contains any typed text */
function inScope(asset, ds, ex, ct) {
  const a = String(asset).toLowerCase(), d = String(ds || "").toLowerCase();
  return (!selSrc.length || selSrc.includes(ds)) && (!ex.length || ex.some(x => a === x || a.startsWith(x + ".") || d === x)) && (!ct.length || ct.some(x => a.includes(x) || d.includes(x)));
}
function hl(text) {
  const t = active().filter(Boolean);
  if (!t.length) return esc(text);
  const low = String(text).toLowerCase(); let out = "", i = 0;
  while (i < text.length) {
    let best = -1, len = 0;
    for (const x of t) { const p = low.indexOf(x, i); if (p >= 0 && (best < 0 || p < best || (p === best && x.length > len))) { best = p; len = x.length; } }
    if (best < 0) { out += esc(text.slice(i)); break; }
    out += esc(text.slice(i, best)) + "<mark>" + esc(text.slice(best, best + len)) + "</mark>"; i = best + len;
  }
  return out;
}

/* table */
const statusChip = st => '<span class="chip ' + (st === "Not Found" ? "bad" : st === "Disabled" ? "warn" : "pend") + '">' + ic(st === "Disabled" ? "minus" : "alert") + esc(st) + '</span>';
const riskChip = r => '<span class="chip ' + (r === "High" ? "bad" : r === "Low" ? "go" : "warn") + '">' + ic(r === "High" ? "alert" : r === "Low" ? "check" : "minus") + esc(r) + '</span>';

}

    : "Replace this owner" + (r.secondary.length ? "; " + r.secondary[0].replace(/ \([OS](, S)?\)$/, "") + " already covers these assets." : ".");

  const where = cat.length ? " Some of these inherit their owner from the catalog (" + cat.join(", ") + "): fix the Data Owner on the catalog and they follow." : "";
  return head + " " + act + where;
}
function assetList(v, q) {
  const f = (q || "").trim().toLowerCase();

  if (!list.length) return '<p class="muted">No asset matches.</p>';
  return '<div class="al"><table><thead><tr><th>Asset</th><th>Level</th><th>Role</th><th>Data source</th><th>Alternative owner</th><th>Coverage</th></tr></thead><tbody>' + list.map(a =>
    '<tr><td class="p">' + (a.url ? '<a href="' + esc(a.url) + '" target="_blank" rel="noopener">' + hl(a.asset) + '</a>' : hl(a.asset)) + ' <button class="cp" type="button" data-copy="' + esc(a.asset) + '" aria-label="Copy ' + esc(a.asset) + '" title="Copy name">' + ic("copy") + '</button></td>' +
    '<td><span class="lv">' + esc(a.level) + '</span></td><td>' + esc(a.role) + '</td><td>' + hl(dsShow(a.data_source || "")) + '</td><td>' +
    (a.alternative ? (a.alternative.length ? a.alternative.map(n => '<div>' + person(n) + '</div>').join("") : '<span class="none">None</span>') : '<span class="muted">&ndash;</span>') + '</td><td>' +
    (a.covered ? '<span class="chip go">' + ic("check") + 'Covered</span>' : '<span class="chip bad">' + ic("alert") + 'No valid owner</span>') + '</td></tr>').join("") + '</tbody></table></div>' +
    '<p class="sm muted">' + fmt(list.length) + ' of ' + fmt(v.total) + ' ' + noun(v.total) + (v.r.total > v.r.assets.length && !v.partial ? ' · the first ' + fmt(v.r.assets.length) + ' are listed' : "") + '</p>';
}
function initials(owner) {
  const t = String(owner || "").trim();
  const p = t.includes("@") ? t.split("@")[0].split(/[._-]+/) : t.includes(",") ? t.split(",").map(x => x.trim()).reverse() : t.split(/\s+/);
  const a = ((p[0] || "")[0] || "") + ((p[1] || "")[0] || "");
  return esc(a.toUpperCase() || "?");
}
function row(v, i) {
  const r = v.r, isOpen = open.has(r.owner);
  const src = r.data_source.length ? hl(dsShow(r.data_source[0])) + (r.data_source.length > 1 ? ' <span class="muted">+' + (r.data_source.length - 1) + '</span>' : "") : D.sources_ready ? '<span class="muted">unknown</span>' : '<span class="muted">reading from Alation…</span>';
  const sec = r.secondary.length ? '<div class="sec">' + r.secondary.map(n => '<span>' + person(n) + '</span>').join("") + '</div>' : '<span class="none">None</span>';
  const dso = r.ds_owner && r.ds_owner.length ? '<div class="sec">' + r.ds_owner.map(n => '<span>' + person(n) + '</span>').join("") + '</div>' : '<span class="muted">Not recorded</span>';
  const total = fmt(v.total) + (v.approx ? "+" : "") + (v.partial ? '<div class="sm muted">of ' + fmt(r.total) + '</div>' : "");
  const unc = v.partial && v.assets.length === v.total ? v.assets.filter(a => !a.covered).length : r.no_cover;
  let h = '<tr class="row' + (isOpen ? " open" : "") + '"><td><div class="who"><button type="button" class="tog" data-open="' + i + '" aria-expanded="' + isOpen + '" aria-label="' + (isOpen ? "Hide" : "Show") + ' assets of ' + esc(r.owner) + '">' + ic("chev") + '</button><span class="av" aria-hidden="true">' + initials(r.owner) + '</span>' +
    '<div><div class="nm">' + esc(r.owner) + (r.role_tags ? ' <span class="tgs">' + tagBadges(r.role_tags) + '</span>' : "") + '</div>' + (r.email && r.email !== r.owner ? '<div class="em">' + esc(r.email) + '</div>' : "") + '</div></div></td>' +
    '<td data-label="Status">' + statusChip(r.status) + '</td><td data-label="Data source"><div class="v">' + src + '</div></td><td data-label="Data source owner / steward"><div class="v">' + dso + '</div></td>' + (D.show_tables ? '<td class="r num" data-label="Assets"><div class="v">' + total + '</div></td>' : "") + (hasCat() ? '<td class="r num" data-label="Catalogs">' + fmt(v.catalogs) + '</td>' : "") + '<td class="r num" data-label="Schemas">' + fmt(v.schemas) +
    '</td>' + (D.show_tables ? '<td class="r num" data-label="Tables">' + fmt(v.tables) + '</td>' : "") + '<td data-label="Alternative owner"><div class="v">' + sec + '</div></td>' +
    '<td data-label="Risk"><div class="v">' + riskChip(r.risk) + (unc ? '<div class="muted sm">' + fmt(unc) + ' ' + noun(unc) + ' uncovered</div>' : "") + '</div></td></tr>';
  if (isOpen) h += '<tr class="det"><td colspan="' + (D.show_tables ? 9 : 8) + '"><div class="dh"><b>Next step</b>' + esc(nextStep(r)) + '</div>' +
    (v.assets.length > 8 ? '<input class="afind" type="search" data-afind="' + i + '" placeholder="Search these assets" aria-label="Search these assets">' : "") + '<div id="al-' + i + '">' + assetList(v, "") + '</div></td></tr>';
  return h;
}
function counts() {
  $("#dl").disabled = !shown.length;
  $("#legend").hidden = !shown.length;                        // the (O) / (S) legend only matters while there are rows
  const high = shown.filter(v => v.r.risk === "High").length;
  $("#cn").innerHTML = D.run.id ? '<span class="cnt">' + fmt(shown.length) + ' owner' + (shown.length === 1 ? "" : "s") + '</span><span class="cnt">' + fmt(shown.reduce((n, v) => n + (D.show_tables || hasCat() ? v.total : v.schemas), 0)) +
    ' ' + noun(shown.reduce((n, v) => n + (D.show_tables || hasCat() ? v.total : v.schemas), 0)) + '</span><span class="cnt ' + (high ? "bad" : "") + '">' + fmt(high) + ' high risk</span>' : "";
}
function wireCopy(root) { root.querySelectorAll("[data-copy]").forEach(b => b.onclick = () => { try { navigator.clipboard.writeText(b.dataset.copy); toast("Copied"); } catch { toast("Copy is not available"); } }); }
/* paging: shows one page of the (already filtered and sorted) rows; counts, downloads and the filters still use all of them */
let pageSize = [10, 25, 50, 100].includes(Number(store.get("stale.rows"))) ? Number(store.get("stale.rows")) : 50, pageNo = 0, pageKey = "";
function pager(total) {
  const pg = $("#pager"), pages = Math.max(1, Math.ceil(total / pageSize));
  if (pageNo > pages - 1) pageNo = pages - 1;
  pg.hidden = total <= 10;                                   // a short list needs no pager
  if (pg.hidden) return [0, total];
  const start = pageNo * pageSize, end = Math.min(total, start + pageSize);
  $("#pg-size").value = String(pageSize);
  $("#pg-range").textContent = "Showing " + fmt(start + 1) + "–" + fmt(end) + " of " + fmt(total) + " owner" + (total === 1 ? "" : "s");
  $("#pg-info").textContent = "Page " + fmt(pageNo + 1) + " of " + fmt(pages);
  $("#pg-prev").disabled = pageNo === 0; $("#pg-next").disabled = pageNo >= pages - 1;
  return [start, end];
}
function goPage(n) { pageNo = n; table(); const t = $("#tw"); if (t.scrollIntoView) t.scrollIntoView({block: "nearest"}); }
$("#pg-prev").onclick = () => goPage(pageNo - 1);
$("#pg-next").onclick = () => goPage(pageNo + 1);
$("#pg-size").onchange = e => { pageSize = Number(e.target.value) || 50; store.set("stale.rows", String(pageSize)); pageNo = 0; table(); };
function table() {
  if (!D.rows.length) {
    shown = []; $("#pager").hidden = true; counts(); $("#export").disabled = true; $("#report").disabled = true;
    $("#tw").innerHTML = D.run.id ? '<div class="empty"><h3>No stale owners</h3><p>Every owner and steward in the latest results is active in the directory.</p></div>'
      : '<div class="empty"><h3>Nothing to show yet</h3><p>Run a validation first.</p></div>';
    return;
  }
  const f = SORTS[sort.key] || SORTS.risk;
  shown = scoped().sort((a, b) => f(a, b) * sort.dir);
  counts(); $("#export").disabled = !shown.length; $("#report").disabled = !shown.length;
  const key = JSON.stringify([src, D.run.id, fStatus, fRisk, selSrc, terms.map(t => t.t + "|" + t.exact), shown.length]);
  if (key !== pageKey) { pageKey = key; pageNo = 0; }       // a new search, filter or data set starts on page 1
  if (!shown.length) {
    $("#pager").hidden = true;
    const ex = exactNames(), ct = containsTerms(), inSc = IDX.assets.filter(([name, , ds]) => inScope(name, ds, ex, ct)).length;
    const known = src === "live" && IDX.assets.length && (ex.length || ct.length || selSrc.length);
    $("#tw").innerHTML = '<div class="empty"><h3>' + (known && inSc ? "No stale owners in this scope" : "No stale owner matches") + '</h3><p>' +
      (known && inSc ? fmt(inSc) + " asset" + (inSc === 1 ? "" : "s") + " read from Alation in this scope, and every owner and steward is valid." : "Nothing in the data sources" + (D.show_tables ? ", schemas or tables" : " or schemas") + " you chose has a stale owner.") +
      '</p><p><button class="qb" id="reset" type="button">Clear search and filters</button></p></div>';
    $("#reset").onclick = () => $("#clear").onclick(); return;
  }
  $("#tw").innerHTML = '<table><thead><tr>' + th("owner", "Owner") + th("status", "Status") + th("source", "Data source") + '<th scope="col" title="(O) owner · (S) steward">Data source owner / steward</th>' + (D.show_tables ? th("total", "Assets", "r") : "") + (hasCat() ? th("catalogs", "Catalogs", "r") : "") + th("schemas", "Schemas", "r") + (D.show_tables ? th("tables", "Tables", "r") : "") +   /* table level is switched off on the server (stale_table.SHOW_TABLE_LEVEL) */
    '<th scope="col">Alternative owner</th>' + th("risk", "Risk") + '</tr></thead><tbody>' + (([from, to]) => shown.slice(from, to).map((v, k) => row(v, from + k)).join(""))(pager(shown.length)) + '</tbody></table>';
  $("#tw").querySelectorAll("[data-sort]").forEach(b => b.onclick = () => {
    const k = b.dataset.sort; sort.dir = sort.key === k ? -sort.dir : (["owner", "status", "source", "risk"].includes(k) ? 1 : -1); sort.key = k; pageNo = 0;
    store.set("stale.sort", JSON.stringify(sort)); table();
  });
  $("#tw").querySelectorAll("[data-open]").forEach(b => b.onclick = () => { const o = shown[Number(b.dataset.open)].r.owner; open.has(o) ? open.delete(o) : open.add(o); table(); });
  $("#tw").querySelectorAll("tr.row").forEach(tr => tr.addEventListener("click", e => { if (!e.target.closest("a, button, input, select")) tr.querySelector("[data-open]").click(); }));
  $("#tw").querySelectorAll("[data-afind]").forEach(inp => inp.oninput = () => { const i = Number(inp.dataset.afind); $("#al-" + i).innerHTML = assetList(shown[i], inp.value); wireCopy($("#al-" + i)); });
  wireCopy($("#tw"));
}

/* live read of Alation */
function liveNames() {
  const names = selSrc.concat(terms.filter(t => t.exact).map(t => t.t));
  if (draft()) names.push(draft());
  return [...new Set(names)];
}
function livebar() {
  const l = D.live, running = l.status === "running" || l.status === "queued", names = liveNames();
  const scope = D.run.scope && D.run.scope !== "Entire catalog" ? " · " + String(D.run.scope).split(", ").map(dsShow).join(", ") : "";
  $("#srcline").textContent = src === "live" ? "Live from Alation · " + when(D.run.finished) + scope : "Latest validation · " + when(D.run.finished || D.run.created);
  $("#lb-dot").className = "lb-dot " + (running ? "run" : src === "live" ? "live" : "");
  $("#live").hidden = running; $("#prog").hidden = !running;
  $("#live").textContent = names.length ? "Search live" : "Check whole catalog";
  $("#live-cancel").hidden = !running; $("#back").hidden = src !== "live" || running;
  const msg = $("#lb-msg"), failed = l.status === "failed";
  msg.hidden = !(running || failed || l.warning);
  msg.className = "lb-msg" + (failed ? " bad" : "");
  msg.innerHTML = running ? '<span class="spin"></span> ' + esc(l.message || "Working…") : failed ? esc(l.error || "The live check failed") : esc(l.warning || "");
  $("#lb-note").textContent = running ? "" : names.length ? "· Search live reads only what you chose" : "· reads the whole catalog, about 2–3 minutes";
}
async function startLive() {
  if (draft()) addTerms(draft(), true, "name");              // text typed but not chosen is looked up by its exact name
  const names = liveNames();
  try {
    const res = await fetch("/api/owners/stale/live", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({names})});
    const j = await res.json().catch(() => ({}));
    if (!res.ok) { toast(j.error || "The live search could not start"); return; }
    wasRunning = true; load(false);
  } catch (e) { toast("The live search could not start: " + e.message); }
}
$("#live").onclick = startLive;
$("#live-cancel").onclick = () => fetch("/api/owners/stale/live/cancel", {method:"POST", headers:{"Content-Type":"application/json"}, body:"{}"}).then(() => load(false)).catch(() => {});
$("#back").onclick = () => { src = "latest"; load(true); };

/* report: an Excel workbook of what is shown, with the same filters */
async function generateReport() {
  const p = new URLSearchParams();
  p.set("source", src);
  selSrc.forEach(x => p.append("ds", x));
  terms.filter(t => t.exact).forEach(t => p.append("name", t.t));
  terms.filter(t => !t.exact).forEach(t => p.append("q", t.t));
  if (draft()) p.append("q", draft());
  if (fStatus) p.set("status", fStatus);
  if (fRisk) p.set("risk", fRisk);
  $("#report").disabled = true;
  try {
    const res = await fetch("/api/owners/stale/report?" + p.toString());
    if (!res.ok) { const j = await res.json().catch(() => ({})); throw new Error(j.error || res.statusText); }
    const blob = await res.blob();
    const name = ((res.headers.get("Content-Disposition") || "").match(/filename="([^"]+)"/) || [])[1] || "stale-owners.xlsx";
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; document.body.append(a); a.click(); a.remove();
    toast("Report downloaded");
  } catch (e) { toast("The report could not be created: " + e.message); }
  $("#report").disabled = !shown.length;
}
$("#report").onclick = generateReport;

/* Esc closes the about popover */
document.addEventListener("keydown", e => { const pp = $("#pop"); if (e.key === "Escape" && !pp.hidden) { pp.hidden = true; $("#info").setAttribute("aria-expanded", "false"); $("#info").focus(); } });

/* download menu */
function dlToggle(force) { const m = $("#dlm"), show = force == null ? m.hidden : force; m.hidden = !show; $("#dl").setAttribute("aria-expanded", String(show)); }
$("#dl").onclick = e => { e.stopPropagation(); dlToggle(); };
$("#report").addEventListener("click", () => dlToggle(false));
$("#export").addEventListener("click", () => dlToggle(false));
document.addEventListener("click", e => { const m = $("#dlm"); if (!m.hidden && !m.contains(e.target)) dlToggle(false); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("#dlm").hidden) { dlToggle(false); $("#dl").focus(); } });

/* export */
$("#export").onclick = () => {
  const q = v => '"' + String(v == null ? "" : v).replace(/"/g, '""') + '"';
  const head = ["Owner", "Email", "Status", "Data source", "Data source owner / steward", ...(D.show_tables ? ["Assets"] : []), ...(hasCat() ? ["Catalogs"] : []), "Schemas", ...(D.show_tables ? ["Tables"] : []), "Alternative owner", "Risk", (D.show_tables || hasCat() ? "Assets" : "Schemas") + " with no valid owner"];
  const lines = [head.map(q).join(",")].concat(shown.map(v => [v.r.owner + (v.r.role_tags ? " (" + v.r.role_tags + ")" : ""), v.r.email, v.r.status, v.r.data_source.join("; "), (v.r.ds_owner || []).join("; "), ...(D.show_tables ? [v.total] : []), ...(hasCat() ? [v.catalogs] : []), v.schemas, ...(D.show_tables ? [v.tables] : []),
    v.r.secondary.join("; "), v.r.risk, v.r.no_cover].map(q).join(",")));
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob(["﻿" + lines.join("\r\n")], {type: "text/csv;charset=utf-8"}));
  a.download = "stale-owners.csv"; document.body.append(a); a.click(); a.remove();
};

function filterOptions() {
  const st = [...new Set(D.rows.map(r => r.status))].sort(), sel = $("#f-status");
  if (sel.options && sel.options.length === st.length + 1) return;
  sel.innerHTML = '<option value="">All statuses</option>' + st.map(s => '<option>' + esc(s) + '</option>').join(""); sel.value = fStatus;
}
function render() { chips(); banner(); stamp(); livebar(); buildIndex(); buildSources(); dsRender(); filterOptions(); renderTags(); table(); }
// UC Concierge, the suite's front door, opens /stale-owners?q=<request>&from=concierge (canonical copy of these two
// functions: uc-concierge-front-door/agent-patches/prefill/concierge-prefill.js).
// --- UC Concierge hand-off
function takeConciergeRequest(href) {
  const url = new URL(href);
  if (url.searchParams.get("from") !== "concierge") return null;
  const q = (url.searchParams.get("q") || "").trim();
  if (!q) return null;
  url.searchParams.delete("q");
  url.searchParams.delete("from");
  return { q, cleanUrl: url.pathname + url.search + url.hash };
}
function fitRequest(q, maxLength) {
  if (!maxLength || q.length <= maxLength) return { text: q, cut: false };
  return { text: q.slice(0, maxLength), cut: true };
}
// --- end UC Concierge hand-off
// This page is review-driven, so the request is shown, not used as a filter (a whole sentence would match nothing).
function conciergeHandoff() {
  const handoff = takeConciergeRequest(location.href);
  if (!handoff) return;
  history.replaceState(null, "", handoff.cleanUrl);
  const note = document.createElement("div");
  note.className = "banner concierge-note";
  note.setAttribute("role", "status");
  const b = document.createElement("b");
  b.textContent = "Request from UC Concierge: ";
  note.append(b, document.createTextNode("“" + fitRequest(handoff.q, 300).text + "”. Search a data source or schema below to check its owners."));
  $("#banner").after(note);
  $("#ci").focus();
}

load(false);
conciergeHandoff();
